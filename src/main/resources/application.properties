spring.application.name=generatorservice
server.port=8000

rate-limit.enabled=true
rate-limit.requests-per-minute=5

llm.default-provider=groq

llm.openai.base-url=https://api.openai.com
llm.openai.api-key=${OPENAI_API_KEY:}
llm.openai.model=gpt-4o-mini
llm.openai.max-tokens=4096

llm.claude.base-url=https://api.anthropic.com
llm.claude.api-key=${ANTHROPIC_API_KEY:}
llm.claude.model=claude-sonnet-4-20250514
llm.claude.max-tokens=4096

llm.grok.base-url=https://api.x.ai
llm.grok.api-key=${GROK_API_KEY:}
llm.grok.model=grok-3
llm.grok.max-tokens=4096

llm.groq.base-url=https://api.groq.com/openai
llm.groq.api-key=${GROQ_API_KEY:}
llm.groq.model=llama-3.3-70b-versatile
llm.groq.max-tokens=4096
